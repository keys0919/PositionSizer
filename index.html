<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  <title>비중 계산기</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --surface-up: #1c1c1e;
      --border: #242424;
      --border-sub: #1a1a1a;
      --accent: #c8981e;
      --accent-dim: #1a1100;
      --accent-line: #3a2a00;
      --text-1: #efefef;
      --text-2: #aaa;
      --text-3: #666;
      --pos: #3a9a6a;
      --pos-dim: #0d1f16;
      --neg: #c24a4a;
      --neg-dim: #1f0d0d;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 28px);
      background: var(--bg);
      color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .meta {
      margin-top: 7px;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field { margin-bottom: 20px; }

    .field label,
    .section-label,
    .result-label,
    .plan-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1);
      font: inherit;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-line);
      box-shadow: 0 0 0 3px rgba(200, 152, 30, 0.08);
    }

    input[type="text"]::placeholder { color: var(--text-3); }

    .unit-btns,
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: #bbb;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    button:active { transform: scale(0.96); }

    .unit-btn {
      flex: 1;
      padding: 0 12px;
    }

    .btn-group button {
      flex: 1;
      padding: 0 8px;
    }

    .btn-group button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0d0d;
    }

    .divider {
      height: 1px;
      margin: 24px -20px;
      background: var(--border);
    }

    .result {
      padding: 20px 0 18px;
      border-bottom: 1px solid var(--border-sub);
      margin-bottom: 20px;
    }

    .result-amount {
      color: var(--accent);
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .result-amount.pos { color: var(--pos); }
    .result-amount.neg { color: var(--neg); }
    .result-amount.zero { color: var(--text-3); }

    .summary {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-sub);
    }

    .row:last-child { border-bottom: none; }

    .row-label {
      width: 88px;
      flex-shrink: 0;
      color: var(--text-2);
      font-size: 13px;
    }

    .row-value {
      flex: 1;
      text-align: right;
      font-size: 17px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .row-pct {
      width: 54px;
      flex-shrink: 0;
      color: var(--text-3);
      font-size: 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .plan-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-sub);
      position: relative;
    }

    .plan-row:last-child { border-bottom: none; }

    .plan-row.current::before {
      content: "";
      position: absolute;
      left: -20px;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 0 2px 2px 0;
      background: var(--accent);
    }

    .stage-tag {
      width: 54px;
      flex-shrink: 0;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .plan-row.current .stage-tag,
    .plan-row.current .row-value {
      color: var(--accent);
    }

    .callout {
      margin-top: 20px;
      padding: 15px 16px;
      border-left: 3px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .callout.pos { background: var(--pos-dim); border-left-color: var(--pos); }
    .callout.neg { background: var(--neg-dim); border-left-color: var(--neg); }

    .callout-title {
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .callout-text {
      color: var(--text-1);
      font-size: 14px;
    }

    .empty {
      padding: 48px 0 16px;
      text-align: center;
      color: var(--text-3);
      font-size: 14px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>비중 계산기</h1>
      <div class="meta">슬롯당 최대 50% · 초입 10 / 눌림 35 / 2차 50</div>
    </header>

    <div class="field">
      <label>총 투자금</label>
      <input type="text" id="total" inputmode="numeric" placeholder="0" oninput="onAmtInput(this, calculate)">
      <div class="unit-btns">
        <button class="unit-btn" onclick="applyUnit('total', 1000, calculate)">000</button>
        <button class="unit-btn" onclick="applyUnit('total', 10000, calculate)">만</button>
        <button class="unit-btn" onclick="applyUnit('total', 100000000, calculate)">억</button>
        <button class="unit-btn" onclick="clearAmt('total', calculate)">C</button>
      </div>
    </div>

    <div class="field">
      <label>슬롯 수</label>
      <div class="btn-group">
        <button id="slots1" class="active" onclick="setSlots(1)">1슬롯</button>
        <button id="slots2" onclick="setSlots(2)">2슬롯</button>
      </div>
    </div>

    <div class="section-label">슬롯 1</div>
    <div class="field">
      <label>진입 형태</label>
      <div class="btn-group">
        <button id="t0b" class="active" onclick="setType(0,'breakout')">초입</button>
        <button id="t0p" onclick="setType(0,'pullback')">눌림</button>
      </div>
    </div>
    <div class="field">
      <label>진입 차수</label>
      <div class="btn-group">
        <button id="g01" class="active" onclick="setStage(0,'1')">1차</button>
        <button id="g02" onclick="setStage(0,'2')">2차</button>
        <button id="g0e" onclick="setStage(0,'exit')">청산</button>
      </div>
    </div>
    <div class="field">
      <label>현재 투입금</label>
      <input type="text" id="holding0" inputmode="numeric" placeholder="0" oninput="onAmtInput(this, calculate)">
      <div class="unit-btns">
        <button class="unit-btn" onclick="applyUnit('holding0', 10000, calculate)">만</button>
        <button class="unit-btn" onclick="applyUnit('holding0', 100000000, calculate)">억</button>
        <button class="unit-btn" onclick="clearAmt('holding0', calculate)">C</button>
      </div>
    </div>

    <div id="slot2" style="display:none">
      <div class="section-label">슬롯 2</div>
      <div class="field">
        <label>진입 형태</label>
        <div class="btn-group">
          <button id="t1b" class="active" onclick="setType(1,'breakout')">초입</button>
          <button id="t1p" onclick="setType(1,'pullback')">눌림</button>
        </div>
      </div>
      <div class="field">
        <label>진입 차수</label>
        <div class="btn-group">
          <button id="g11" class="active" onclick="setStage(1,'1')">1차</button>
          <button id="g12" onclick="setStage(1,'2')">2차</button>
          <button id="g1e" onclick="setStage(1,'exit')">청산</button>
        </div>
      </div>
      <div class="field">
        <label>현재 투입금</label>
        <input type="text" id="holding1" inputmode="numeric" placeholder="0" oninput="onAmtInput(this, calculate)">
        <div class="unit-btns">
          <button class="unit-btn" onclick="applyUnit('holding1', 10000, calculate)">만</button>
          <button class="unit-btn" onclick="applyUnit('holding1', 100000000, calculate)">억</button>
          <button class="unit-btn" onclick="clearAmt('holding1', calculate)">C</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <div id="result"></div>
  </main>

  <script>
    const state = {
      slots: 1,
      s: [
        { type: 'breakout', stage: '1' },
        { type: 'breakout', stage: '1' }
      ]
    };

    // 한 슬롯 목표비중(총 투자금 대비). 슬롯당 최대 50%.
    function slotTargetPct(sl) {
      if (sl.stage === 'exit') return 0;
      if (sl.stage === '2') return 0.50;                // 2차
      return sl.type === 'breakout' ? 0.10 : 0.35;      // 초입 1차 / 눌림 1차
    }

    function slotLabel(sl) {
      if (sl.stage === 'exit') return '청산';
      if (sl.stage === '2') return '2차';
      return sl.type === 'breakout' ? '초입 · 1차' : '눌림 · 1차';
    }

    function rawVal(id) {
      const v = document.getElementById(id).value.replace(/,/g, '');
      return parseFloat(v) || 0;
    }

    function onAmtInput(el, recalc) {
      const prevDigits = (el.dataset.fmt || '').replace(/[^0-9]/g, '');
      const prevLen = (el.dataset.fmt || '').length;
      const curDigits = el.value.replace(/[^0-9]/g, '');
      const curLen = el.value.length;

      let digits = curDigits;
      if (digits === prevDigits && curLen < prevLen) {
        digits = digits.slice(0, -1);
      }

      const formatted = digits === '' ? '' : parseInt(digits, 10).toLocaleString('ko-KR');
      el.value = formatted;
      el.dataset.fmt = formatted;
      recalc();
    }

    function applyUnit(id, unit, recalc) {
      const el = document.getElementById(id);
      const n = rawVal(id);
      if (n <= 0) return;
      const formatted = (n * unit).toLocaleString('ko-KR');
      el.value = formatted;
      el.dataset.fmt = formatted;
      recalc();
    }

    function clearAmt(id, recalc) {
      const el = document.getElementById(id);
      el.value = '';
      el.dataset.fmt = '';
      recalc();
    }

    function fmt(n) {
      if (!isFinite(n) || n === null) return '—';
      return Math.round(n).toLocaleString('ko-KR') + '원';
    }

    function pct(n) {
      return n.toFixed(1) + '%';
    }

    function setType(i, type) {
      state.s[i].type = type;
      document.getElementById('t' + i + 'b').classList.toggle('active', type === 'breakout');
      document.getElementById('t' + i + 'p').classList.toggle('active', type === 'pullback');
      calculate();
    }

    function setStage(i, stage) {
      state.s[i].stage = stage;
      document.getElementById('g' + i + '1').classList.toggle('active', stage === '1');
      document.getElementById('g' + i + '2').classList.toggle('active', stage === '2');
      document.getElementById('g' + i + 'e').classList.toggle('active', stage === 'exit');
      // 2차·청산은 진입 형태와 무관 → 형태 버튼 dim
      const dim = (stage === '2' || stage === 'exit');
      document.getElementById('t' + i + 'b').style.opacity = dim ? 0.4 : 1;
      document.getElementById('t' + i + 'p').style.opacity = dim ? 0.4 : 1;
      calculate();
    }

    function setSlots(n) {
      state.slots = n;
      document.getElementById('slots1').classList.toggle('active', n === 1);
      document.getElementById('slots2').classList.toggle('active', n === 2);
      document.getElementById('slot2').style.display = n === 2 ? '' : 'none';
      calculate();
    }

    function signedAmount(n) {
      if (n > 0) return '+' + fmt(n);
      if (n < 0) return '−' + fmt(Math.abs(n));
      return fmt(0);
    }

    function calculate() {
      const total = rawVal('total');
      const el = document.getElementById('result');

      if (!total || total <= 0) {
        el.innerHTML = '<p class="empty">총 투자금을 입력하세요</p>';
        return;
      }

      const n = state.slots;
      let sumTarget = 0, sumHold = 0, cards = '';

      for (let i = 0; i < n; i++) {
        const sl = state.s[i];
        const hold = rawVal('holding' + i);
        const tp = slotTargetPct(sl);
        const tgt = total * tp;
        const delta = tgt - hold;
        sumTarget += tgt;
        sumHold += hold;

        const dc = delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'zero';
        const dl = delta > 0 ? '추가 필요금' : delta < 0 ? '축소 필요금' : '조정 없음';

        cards += `
          <div class="section-label">슬롯 ${i + 1} · ${slotLabel(sl)}</div>
          <div class="result">
            <span class="result-label">${dl}</span>
            <div class="result-amount ${dc}">${signedAmount(delta)}</div>
          </div>
          <div class="summary">
            <div class="row">
              <span class="row-label">목표금</span>
              <span class="row-value">${fmt(tgt)}</span>
              <span class="row-pct">${pct(tp * 100)}</span>
            </div>
            <div class="row">
              <span class="row-label">현재 투입</span>
              <span class="row-value">${fmt(hold)}</span>
              <span class="row-pct">${pct(hold / total * 100)}</span>
            </div>
          </div>`;
      }

      const cash = total - sumTarget;
      const sumHtml = `
        <div class="section-label">합계</div>
        <div class="summary">
          <div class="row">
            <span class="row-label">목표 합계</span>
            <span class="row-value">${fmt(sumTarget)}</span>
            <span class="row-pct">${pct(sumTarget / total * 100)}</span>
          </div>
          <div class="row">
            <span class="row-label">현재 투입</span>
            <span class="row-value">${fmt(sumHold)}</span>
            <span class="row-pct">${pct(sumHold / total * 100)}</span>
          </div>
          <div class="row">
            <span class="row-label">현금</span>
            <span class="row-value">${fmt(cash)}</span>
            <span class="row-pct">${pct(cash / total * 100)}</span>
          </div>
        </div>`;

      el.innerHTML = cards + sumHtml + `
        <div class="callout">
          <div class="callout-title">기준</div>
          <div class="callout-text">한 슬롯 최대 50% · 초입 1차 10% / 눌림 1차 35% / 2차 50% / 청산 0%. 여력 시 우선순위: 2차 &gt; 눌림 &gt; 초입.</div>
        </div>`;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }

    calculate();
  </script>
</body>
</html>
