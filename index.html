<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  <title>비중 계산기</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --surface-up: #1c1c1e;
      --border: #242424;
      --border-sub: #1a1a1a;
      --accent: #c8981e;
      --accent-dim: #1a1100;
      --accent-line: #3a2a00;
      --text-1: #efefef;
      --text-2: #aaa;
      --text-3: #666;
      --pos: #3a9a6a;
      --pos-dim: #0d1f16;
      --neg: #c24a4a;
      --neg-dim: #1f0d0d;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 28px);
      background: var(--bg);
      color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .meta {
      margin-top: 7px;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── 존 구분 ── */
    .zone-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--text-3);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .zone-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-sub);
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1);
      font: inherit;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-line);
      box-shadow: 0 0 0 3px rgba(200, 152, 30, 0.08);
    }

    input[type="text"]::placeholder { color: var(--text-3); }

    .unit-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: #bbb;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    button:active { transform: scale(0.97); }

    .unit-btn {
      flex: 1;
      padding: 0 12px;
    }

    /* ── 상황 선택 트리거 (CTA) ── */
    .sit-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 0 18px;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 12px;
      color: #0d0d0d;
      font-size: 18px;
      font-weight: 700;
      text-align: left;
      box-shadow: 0 4px 16px rgba(200, 152, 30, 0.22);
    }
    .sit-trigger .chev { color: #0d0d0d; opacity: 0.65; font-size: 14px; flex-shrink: 0; font-weight: 700; }
    /* 선택 완료 상태: 채운 CTA 유지하되 "변경" 뉘앙스로 살짝 낮춤 */
    .sit-trigger.chosen {
      background: var(--accent-dim);
      border-color: var(--accent-line);
      color: var(--accent);
      box-shadow: none;
    }
    .sit-trigger.chosen .chev { color: var(--accent); opacity: 0.7; }

    .divider {
      height: 1px;
      margin: 24px -20px;
      background: var(--border);
    }

    /* ── 결과 ── */
    .result {
      padding: 4px 0 18px;
    }

    .result-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .result-amount {
      color: var(--accent);
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .result-amount.zero { color: var(--text-3); }

    .summary {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-sub);
    }
    .row:last-child { border-bottom: none; }

    .row-label {
      width: 96px;
      flex-shrink: 0;
      color: var(--text-2);
      font-size: 13px;
    }

    .row-value {
      flex: 1;
      text-align: right;
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .empty {
      padding: 40px 0 12px;
      text-align: center;
      color: var(--text-3);
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .foot-note {
      margin-top: 22px;
      color: var(--text-3);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* ── 바텀시트 ── */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
      z-index: 10;
    }
    .sheet-overlay.open { opacity: 1; visibility: visible; }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      max-width: 520px;
      margin: 0 auto;
      background: var(--surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 10px 16px calc(env(safe-area-inset-bottom) + 20px);
      transform: translateY(101%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      margin: 6px auto 14px;
    }

    .sheet-title {
      color: var(--text-3);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin: 0 4px 8px;
    }

    .sheet-row {
      width: 100%;
      display: block;
      min-height: 0;
      padding: 14px 14px;
      margin-top: 13px;
      background: var(--surface-up);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: left;
    }
    .sheet-row:first-child { margin-top: 4px; }
    .sheet-row { box-shadow: inset 3px 0 0 var(--accent-line); }
    .sheet-row.sel { border-color: var(--accent-line); background: var(--accent-dim); box-shadow: inset 3px 0 0 var(--accent); }

    .sheet-row-main {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .sheet-row-label {
      color: var(--text-1);
      font-size: 17px;
      font-weight: 600;
    }
    .sheet-row.sel .sheet-row-label { color: var(--accent); }
    .sheet-row-amt {
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .sheet-row-sub {
      margin-top: 4px;
      color: var(--text-3);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>비중 계산기</h1>
      <div class="meta">이번 스텝 추가액 · 슬롯 상한 50%</div>
    </header>

    <div class="zone-head">입력</div>

    <div class="field">
      <label>총 자본금</label>
      <input type="text" id="total" inputmode="numeric" placeholder="0" oninput="onAmtInput(this, calculate)">
      <div class="unit-btns">
        <button class="unit-btn" onclick="applyUnit('total', 1000, calculate)">000</button>
        <button class="unit-btn" onclick="applyUnit('total', 10000, calculate)">만</button>
        <button class="unit-btn" onclick="applyUnit('total', 1000000, calculate)">백만</button>
        <button class="unit-btn" onclick="clearAmt('total', calculate)">C</button>
      </div>
    </div>

    <div class="field">
      <label>상황</label>
      <button class="sit-trigger" id="sitTrigger" onclick="openSheet()">
        <span id="sitTriggerLabel">상황 선택</span>
        <span class="chev">▾</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="zone-head">결과</div>
    <div id="result"></div>

    <div class="foot-note">v10 staged · 초입1차 10 / 눌림1차 35 / 2차 50%</div>
  </main>

  <div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">상황 선택 · 이번 추가액</div>
    <div id="sheetList"></div>
  </div>

  <script>
    // 개별주 단일 전략(전 자본 기준). 2슬롯 × 슬롯상한 50% = 최대 100%.
    //   (섹터 ETF 오버레이는 2026-08-03 기각 — 국면 미스매치·역비대칭. 실전 미투입.)
    // 상황별 이번 스텝 추가 비중(총자본 대비). 직전 차수는 staged 플랜값 가정.
    //   초입1차 10 · 눌림1차 35 · 2차 완료 50 → 증분:
    //   초입1차 진입 = +10 / 눌림1차 진입 = +35 / 초입1차→2차 = +40 / 눌림1차→2차 = +15
    // 단일 소스: 아래 배열만 수정한다. 값은 지침 v10(사례73) 확정분 — 임의 변경 금지.
    const SIT = [
      { key: 'b1', label: '초입 1차',        flow: '0 → 10%',  inc: 0.10 },
      { key: 'p1', label: '눌림 1차',        flow: '0 → 35%',  inc: 0.35 },
      { key: 'b2', label: '초입 1차 → 2차',  flow: '10 → 50%', inc: 0.40 },
      { key: 'p2', label: '눌림 1차 → 2차',  flow: '35 → 50%', inc: 0.15 }
    ];

    let selected = null;

    function rawVal(id) {
      const v = document.getElementById(id).value.replace(/,/g, '');
      return parseFloat(v) || 0;
    }

    function onAmtInput(el, recalc) {
      const prevDigits = (el.dataset.fmt || '').replace(/[^0-9]/g, '');
      const prevLen = (el.dataset.fmt || '').length;
      const curDigits = el.value.replace(/[^0-9]/g, '');
      const curLen = el.value.length;

      let digits = curDigits;
      if (digits === prevDigits && curLen < prevLen) {
        digits = digits.slice(0, -1);
      }

      const formatted = digits === '' ? '' : parseInt(digits, 10).toLocaleString('ko-KR');
      el.value = formatted;
      el.dataset.fmt = formatted;
      recalc();
    }

    function applyUnit(id, unit, recalc) {
      const el = document.getElementById(id);
      const n = rawVal(id);
      if (n <= 0) return;
      const formatted = (n * unit).toLocaleString('ko-KR');
      el.value = formatted;
      el.dataset.fmt = formatted;
      recalc();
    }

    function clearAmt(id, recalc) {
      const el = document.getElementById(id);
      el.value = '';
      el.dataset.fmt = '';
      recalc();
    }

    function fmt(n) {
      if (!isFinite(n) || n === null) return '—';
      return Math.round(n).toLocaleString('ko-KR') + '원';
    }

    function openSheet() {
      renderSheet();
      document.getElementById('overlay').classList.add('open');
      document.getElementById('sheet').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('sheet').classList.remove('open');
    }

    function selectSit(key) {
      selected = key;
      closeSheet();
      calculate();
    }

    function renderSheet() {
      const total = rawVal('total');
      document.getElementById('sheetList').innerHTML = SIT.map(function (s) {
        const pct = (s.inc * 100).toFixed(0);
        const amt = total > 0 ? '+' + fmt(total * s.inc) : pct + '%';
        return '<button class="sheet-row ' + (selected === s.key ? 'sel' : '') + '" onclick="selectSit(\'' + s.key + '\')">'
          + '<div class="sheet-row-main">'
          + '<span class="sheet-row-label">' + s.label + '</span>'
          + '<span class="sheet-row-amt">' + amt + '</span>'
          + '</div>'
          + '<div class="sheet-row-sub">' + s.flow + ' · 총자본의 ' + pct + '%</div>'
          + '</button>';
      }).join('');
    }

    function calculate() {
      renderSheet();
      const total = rawVal('total');
      const el = document.getElementById('result');
      const trigger = document.getElementById('sitTrigger');
      const sit = selected ? SIT.find(function (s) { return s.key === selected; }) : null;

      document.getElementById('sitTriggerLabel').textContent = sit ? sit.label : '상황 선택';
      trigger.classList.toggle('chosen', !!sit);

      if (!total || total <= 0) {
        el.innerHTML = '<p class="empty">총 자본금을 입력하세요</p>';
        return;
      }
      if (!sit) {
        el.innerHTML = '<p class="empty">상황을 선택하세요</p>';
        return;
      }

      const amt = total * sit.inc;
      const pct = (sit.inc * 100).toFixed(0);
      el.innerHTML =
        '<div class="result">'
        + '<span class="result-label">이번 추가</span>'
        + '<div class="result-amount">+' + fmt(amt) + '</div>'
        + '</div>'
        + '<div class="summary">'
        + '<div class="row"><span class="row-label">상황</span><span class="row-value">' + sit.label + '</span></div>'
        + '<div class="row"><span class="row-label">비중 이동</span><span class="row-value">' + sit.flow + ' (총자본)</span></div>'
        + '<div class="row"><span class="row-label">총자본 대비</span><span class="row-value">' + pct + '%</span></div>'
        + '</div>';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }

    calculate();
  </script>
</body>
</html>
